name: Enviar picks a Telegram
on:
  push:
    branches: [main]
    paths: [index.html]
  workflow_dispatch:
jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/telegram.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: "6989861835"
          COMMIT_MSG: ${{ github.event.head_commit.message }}
