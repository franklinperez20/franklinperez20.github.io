name: diag-polymarket
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          D1=$(date -u -d '-1 day' +%Y-%m-%dT%H:%M:%SZ); D2=$(date -u -d '+12 day' +%Y-%m-%dT%H:%M:%SZ)
          B="https://gamma-api.polymarket.com"
          q="series_id=10188&closed=false&end_date_min=$D1&end_date_max=$D2"
          for ua in "Mozilla/5.0" "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36" "curl/8" "python-requests/2.32"; do
            for acc in "application/json" "*/*"; do
              for path in "/events?$q&limit=200&offset=0" "/events?$q&limit=100" "/events/keyset?$q&limit=100" "/sports"; do
                c=$(curl -s -o /tmp/o -w '%{http_code}' -A "$ua" -H "Accept: $acc" "$B$path"); echo "$c | ${ua:0:20} | $acc | ${path:0:16} | $(head -c 120 /tmp/o)"
              done; done; done
