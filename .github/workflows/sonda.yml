name: sonda
on:
  push:
    branches: [prueba-modelo]
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        dep: [basketball, soccer, hockey, tennis, "american-football,baseball"]
    steps:
      - uses: actions/checkout@v4
      - run: python3 -u scripts/prueba_modelo.py "${{ matrix.dep }}" 10
